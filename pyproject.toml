[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tamabench"
version = "2.0.0"
description = "Persistent Sandbox Agent Benchmark for Small AI Models"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "TamaBench Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "numpy>=1.24",
    "httpx>=0.27",
]

[project.scripts]
tamabench = "tamabench.cli:cli"

[tool.setuptools.packages.find]
include = ["tamabench*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"tamabench.spec" = ["*.yaml"]
